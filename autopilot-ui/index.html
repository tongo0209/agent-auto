<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autopilot</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root {
  --bg: #0b0d10; --bg-2: #111418; --bg-3: #171b21; --line: #232a33; --line-2: #2e3742;
  --text: #e7ebef; --text-2: #9aa5b1; --text-3: #66717d;
  --ok: #34d399; --run: #60a5fa; --wait: #fbbf24; --stop: #f87171; --idle: #3a434e;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
body { min-height: 100dvh; display: grid; grid-template-columns: 300px 1fr; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

aside { border-right: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; height: 100dvh; position: sticky; top: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand b { font-size: 15px; letter-spacing: -0.01em; }
.brand .new { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: var(--r); color: var(--text-2); font-size: 12px; transition: border-color .2s, color .2s, transform .1s; }
.brand .new:hover { border-color: var(--ok); color: var(--text); }
.brand .new:active { transform: scale(0.97); }
.brand kbd { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.queue { overflow-y: auto; padding: 0 10px 20px; flex: 1; }
.group { margin-top: 14px; }
.group h3 { margin: 0 8px 6px; font-size: 12px; font-weight: 600; color: var(--text-3); display: flex; justify-content: space-between; }
.item { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px; border-radius: var(--r); border: 1px solid transparent; transition: background .2s, border-color .2s; }
.item:hover { background: var(--bg-3); }
.item.on { background: var(--bg-3); border-color: var(--line-2); }
.item .key { font-weight: 600; }
.item .cost { color: var(--text-2); font-size: 12px; align-self: center; }
.item .sub { grid-column: 1 / -1; color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini { grid-column: 1 / -1; display: flex; gap: 3px; margin-top: 6px; }
.mini i { height: 3px; flex: 1; border-radius: 2px; background: var(--idle); transition: background .4s; }
.mini i.done { background: var(--ok); } .mini i.running { background: var(--run); } .mini i.waiting { background: var(--wait); } .mini i.stopped { background: var(--stop); }
.group.need .item .key::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--wait); margin-left: 8px; vertical-align: middle; animation: breathe 2s var(--ease) infinite; }

main { min-width: 0; padding: 28px 36px 140px; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; line-height: 1.1; }
.state { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid currentColor; }
.state.paused, .state.attached { color: var(--wait); } .state.running { color: var(--run); } .state.stopped { color: var(--stop); } .state.done { color: var(--ok); }
.meta { color: var(--text-2); margin-top: 8px; font-size: 13px; }
.meta code { font-family: var(--mono); font-size: 12px; color: var(--text-3); word-break: break-all; }

.top { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
.meters { display: flex; gap: 18px; }
.meter { display: grid; grid-template-columns: 52px auto; align-items: center; gap: 10px; }
.meter svg { transform: rotate(-90deg); }
.meter circle { fill: none; stroke-width: 5; }
.meter .track { stroke: var(--line); }
.meter .val { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease), stroke .3s; }
.meter .val.hot { stroke: var(--wait); } .meter .val.over { stroke: var(--stop); }
.meter b { display: block; font-family: var(--mono); font-size: 16px; }
.meter small { color: var(--text-3); font-size: 12px; }

.flow { position: relative; margin: 34px 0 10px; padding: 8px 4px 0; overflow-x: auto; }
.flow-inner { position: relative; min-width: max-content; }
.flow svg.wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.lane { display: flex; gap: 44px; position: relative; z-index: 1; }
.lane.side { margin-top: 64px; padding-left: 0; }
.node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; text-align: center; cursor: pointer; }
.node:hover .dot { transform: scale(1.08); }
.node.gate:hover .dot { transform: rotate(45deg) scale(1.08); }
.sending { display: inline-flex; align-items: center; gap: 8px; color: var(--wait); font-weight: 600; padding: 10px 4px; }
.dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; border: 2px solid var(--idle); background: var(--bg); color: var(--text-3); transition: border-color .4s var(--ease), background .4s var(--ease), color .4s, transform .3s var(--ease); }
.node .name { font-size: 12px; font-weight: 600; color: var(--text-2); line-height: 1.25; }
.node .note { font-family: var(--mono); font-size: 11px; color: var(--text-3); min-height: 16px; }
.node.pause .dot { border-radius: 12px; }
.node.gate .dot { border-radius: 6px; transform: rotate(45deg); } .node.gate .dot i { transform: rotate(-45deg); }
.node.done .dot { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--bg)); color: var(--ok); }
.node.done .name { color: var(--text); }
.node.running .dot { border-color: var(--run); color: var(--run); box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 50%, transparent); animation: ring 1.6s var(--ease) infinite; }
.node.waiting .dot { border-color: var(--wait); color: var(--wait); background: color-mix(in srgb, var(--wait) 14%, var(--bg)); animation: ring-wait 2.2s var(--ease) infinite; }
.node.stopped .dot { border-color: var(--stop); color: var(--stop); background: color-mix(in srgb, var(--stop) 14%, var(--bg)); }
.node.running .name, .node.waiting .name, .node.stopped .name { color: var(--text); }
.node.pending .dot { border-style: dashed; }
.node.pop .dot { animation: pop .7s var(--ease); }
.node .spin { animation: spin 1.1s linear infinite; }
.badge-round { position: absolute; top: -6px; left: calc(50% + 12px); font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--line-2); color: var(--text-2); }

.wire { fill: none; stroke-width: 2; stroke: var(--idle); stroke-dasharray: 4 6; }
.wire.done { stroke: var(--ok); stroke-dasharray: none; opacity: .7; }
.wire.live { stroke: var(--run); stroke-dasharray: 8 8; animation: flow 0.9s linear infinite; }
.wire.live.wait { stroke: var(--wait); animation-duration: 2.4s; }
.wire.loop { stroke: var(--line-2); stroke-dasharray: 3 5; }
.wire.loop.used { stroke: var(--wait); opacity: .75; stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
.packet { fill: var(--run); filter: drop-shadow(0 0 6px var(--run)); }
.packet.wait { fill: var(--wait); filter: drop-shadow(0 0 6px var(--wait)); }

.dock { position: fixed; left: 300px; right: 0; bottom: 0; padding: 16px 36px 20px; background: linear-gradient(to top, var(--bg) 70%, transparent); transform: translateY(110%); transition: transform .5s var(--ease); z-index: 5; }
.dock.show { transform: none; }
.dock-card { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; background: var(--bg-3); border: 1px solid color-mix(in srgb, var(--wait) 45%, var(--line)); border-radius: 14px; padding: 14px 16px; box-shadow: 0 20px 50px rgb(0 0 0 / .45); }
.dock-card label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.dock-card label b { color: var(--wait); font-weight: 600; }
.dock-card textarea { width: 100%; min-height: 44px; max-height: 160px; resize: vertical; background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 12px; outline: none; transition: border-color .2s; }
.dock-card textarea:focus { border-color: var(--text-2); }
.dock-card textarea::placeholder { color: var(--text-3); }
.dock-card .prev { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.actions { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--r); font-weight: 600; white-space: nowrap; border: 1px solid var(--line-2); background: var(--bg-2); transition: transform .1s, background .2s, border-color .2s, opacity .2s; }
.btn:active { transform: translateY(1px) scale(0.98); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.go { background: var(--ok); border-color: var(--ok); color: #05261a; }
.btn.go:hover { background: #4ee0ad; }
.btn.back { color: #fecaca; border-color: color-mix(in srgb, var(--stop) 60%, var(--line)); }
.btn.back:hover { background: color-mix(in srgb, var(--stop) 14%, var(--bg-2)); }
.btn.ghost { color: var(--text-2); }
.btn kbd { font-family: var(--mono); font-size: 11px; opacity: .65; }

.panes { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; margin-top: 30px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tab { padding: 9px 12px; color: var(--text-3); font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color .2s, border-color .2s; }
.tab:hover { color: var(--text-2); }
.tab.on { color: var(--text); border-color: var(--text); }
.tab .star { color: var(--wait); margin-right: 4px; }
.doc { animation: rise .35s var(--ease); }
.md { max-width: 120ch; color: #cfd6dd; }
.md h1, .md h2, .md h3 { color: var(--text); letter-spacing: -0.01em; margin: 1.4em 0 .5em; line-height: 1.25; }
.md h1 { font-size: 20px; margin-top: 0; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--bg-3); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md ul { padding-left: 20px; } .md li { margin: 3px 0; }
.md table { border-collapse: collapse; font-size: 13px; margin: 8px 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--bg-2); color: var(--text); font-weight: 600; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--line-2); color: var(--text-2); }
pre.raw { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--text-2); margin: 0; }
.verdict { display: grid; gap: 14px; }
.verdict .tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
.verdict .tag.pass { color: var(--ok); } .verdict .tag.revise, .verdict .tag.fail { color: var(--wait); }
.finding { padding: 10px 12px 10px 14px; border-left: 2px solid var(--wait); background: var(--bg-2); border-radius: 0 var(--r) var(--r) 0; font-size: 13px; animation: rise .4s var(--ease) both; }
.finding.adv { border-color: var(--line-2); color: var(--text-2); }
.verdict h4 { margin: 4px 0 0; font-size: 12px; color: var(--text-3); font-weight: 600; }

.timeline { position: relative; padding-left: 18px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
.tl { position: relative; padding: 0 0 14px; animation: rise .4s var(--ease) both; }
.tl::before { content: ""; position: absolute; left: -17px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ok); }
.tl.revise::before, .tl.fail::before { border-color: var(--wait); }
.tl .row1 { display: flex; justify-content: space-between; gap: 8px; }
.tl .row1 b { font-size: 13px; }
.tl .row1 span { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.tl .row2 { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
.side-h { font-size: 13px; color: var(--text-2); font-weight: 600; margin: 0 0 12px; }
.total { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--text-2); }

.empty { display: grid; place-items: center; text-align: center; min-height: 60dvh; color: var(--text-2); }
.empty i { font-size: 40px; color: var(--text-3); }
.empty p { max-width: 42ch; }
.skel { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--bg-2), var(--bg-3), var(--bg-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; margin: 10px 0; }

.veil { position: fixed; inset: 0; background: rgb(5 7 9 / .6); backdrop-filter: blur(4px); display: grid; place-items: start center; padding-top: 18dvh; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.veil.show { opacity: 1; pointer-events: auto; }
.palette { width: min(560px, calc(100vw - 32px)); background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 30px 80px rgb(0 0 0 / .5); transform: translateY(-8px) scale(.98); transition: transform .3s var(--ease); }
.veil.show .palette { transform: none; }
.palette input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; font-size: 16px; outline: none; }
.palette input::placeholder { color: var(--text-3); }
.flows { padding: 8px; display: grid; gap: 2px; }
.flowopt { text-align: left; padding: 10px 12px; border-radius: var(--r); display: flex; justify-content: space-between; gap: 10px; color: var(--text-2); }
.flowopt.on, .flowopt:hover { background: var(--bg-2); color: var(--text); }
.flowopt small { color: var(--text-3); font-family: var(--mono); }
.palette .foot { padding: 10px 18px 14px; font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; }

.toast { position: fixed; right: 20px; top: 20px; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 14px; font-size: 13px; transform: translateY(calc(-100% - 40px)); transition: transform .4s var(--ease); z-index: 20; max-width: 380px; }
.toast.show { transform: none; }
.toast.err { border-color: var(--stop); }

@keyframes flow { to { stroke-dashoffset: -32; } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
@keyframes ring-wait { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--wait) 45%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes breathe { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .packet { display: none; }
}
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .queue { max-height: 240px; }
  main { padding: 20px 16px 160px; }
  .top, .panes { grid-template-columns: 1fr; }
  .dock { left: 0; padding: 12px 16px 16px; }
  .dock-card { grid-template-columns: 1fr; }
  .lane { gap: 28px; }
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <i class="ph-bold ph-flow-arrow" style="font-size:20px;color:var(--ok)"></i>
    <b>Autopilot</b>
    <button class="new" id="openPalette"><i class="ph ph-plus"></i>Chạy ticket <kbd>⌘K</kbd></button>
  </div>
  <div class="queue" id="queue"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</aside>

<main id="main"><div class="skel" style="width:30%;height:28px"></div><div class="skel" style="height:80px"></div></main>

<div class="dock" id="dock">
  <div class="dock-card">
    <div>
      <label for="note">Chờ bạn ở <b id="dockStage"></b>. Duyệt để chạy tiếp, hoặc ghi chú rồi trả về.</label>
      <textarea id="note" placeholder="Ghi chú khi trả về: cần sửa gì..."></textarea>
      <div class="prev" id="prevNote"></div>
    </div>
    <div class="actions" id="actions"></div>
  </div>
</div>

<div class="veil" id="veil">
  <div class="palette" role="dialog" aria-label="Chạy ticket mới">
    <input id="ticket" placeholder="GW-123 hoặc link sheet / Jira" autocomplete="off">
    <div class="flows" id="flows"></div>
    <div class="foot"><span>↑↓ chọn luồng · Enter chạy · Esc đóng</span><span id="paletteHint"></span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const money = (n) => `$${(n ?? 0).toFixed(2)}`;
const mins = (ms) => Math.round((ms ?? 0) / 60000);
const globRe = (g) => new RegExp('^' + g.split('*').map((p) => p.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$');

const STATUS = { paused: 'Chờ bạn duyệt', attached: 'Chờ chạy trong phiên', running: 'Đang chạy', stopped: 'Đã dừng', done: 'Xong' };
const GROUPS = [['need', 'Cần bạn', ['paused', 'attached']], ['run', 'Đang chạy', ['running']], ['stop', 'Đã dừng', ['stopped']], ['done', 'Xong', ['done']]];
const ICON_BY_STATE = { done: 'ph-check', running: 'ph-circle-notch spin', waiting: 'ph-hand', stopped: 'ph-x' };
const ICON_BY_ID = { plan: 'ph-map-trifold', 'plan-review': 'ph-magnifying-glass', implement: 'ph-code', 'code-review': 'ph-git-diff', gates: 'ph-shield-check', 'gates-final': 'ph-shield-check', 'ui-check': 'ph-browser', fix: 'ph-wrench', commit: 'ph-git-commit', cut: 'ph-scissors', 'check-design': 'ph-ruler', spec: 'ph-list-checks', 'clean-code': 'ph-broom', 'intake-triage': 'ph-tray', lanes: 'ph-git-fork', verify: 'ph-check-square', 'write-sheet': 'ph-table' };
const TAB_LABEL = (f) => f === 'plan.md' ? 'Plan' : `${f.endsWith('.log') ? 'Log ' : ''}${f.replace(/\.(json|log|md)$/, '').replace(/-r(\d+)$/, ' · vòng $1')}`;

let data = { runs: [], flows: [] };
let selectedKey = null;
let artifact = null;
let lastStates = {};
let lastSig = '';
let flowChoice = 0;
let runFiles = [];
const ACTION_LABEL = { approve: 'duyệt', reject: 'trả về', abort: 'huỷ', resume: 'chạy tiếp' };

function toast(text, err) {
  const t = $('#toast');
  t.textContent = text;
  t.className = `toast show${err ? ' err' : ''}`;
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = 'toast'), 4200);
}

async function post(action, body) {
  try {
    const res = await fetch(`/api/autopilot/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const out = await res.json();
    toast(res.ok ? 'Đã gửi. Autopilot chạy nền, trang tự cập nhật.' : `Không gửi được: ${out.error}`, !res.ok);
    return res.ok;
  } catch (e) {
    toast(`Không tới được server autopilot: ${e.message}`, true);
    return false;
  }
}

function renderQueue() {
  if (!data.runs.length) {
    $('#queue').innerHTML = '<p style="color:var(--text-3);padding:12px 8px;font-size:13px">Chưa có run nào. Bấm "Chạy ticket" để bắt đầu.</p>';
    return;
  }
  $('#queue').innerHTML = GROUPS.map(([cls, title, statuses]) => {
    const runs = data.runs.filter((r) => statuses.includes(r.status));
    if (!runs.length) return '';
    return `<div class="group ${cls}"><h3><span>${title}</span><span class="mono">${runs.length}</span></h3>${runs.map((r) => `
      <button class="item ${r.key === selectedKey ? 'on' : ''}" data-key="${esc(r.key)}">
        <span class="key">${esc(r.key)}</span><span class="cost mono">${money(r.totals.usd)}</span>
        <span class="sub">${esc(r.flowLabel)} · ${esc(r.stage ?? 'hoàn tất')}</span>
        <span class="mini">${r.cells.filter((c) => !c.side).map((c) => `<i class="${c.state}"></i>`).join('')}</span>
      </button>`).join('')}</div>`;
  }).join('');
}

function mainLane(cells) {
  const byId = Object.fromEntries(cells.map((c) => [c.id, c]));
  const lane = [];
  for (let c = cells[0]; c && !lane.includes(c); c = byId[c.next]) lane.push(c);
  return { lane, side: cells.filter((c) => !lane.includes(c)) };
}

function nodeHtml(c) {
  const icon = ICON_BY_STATE[c.state] ?? ICON_BY_ID[c.id] ?? 'ph-circle';
  const note = c.state === 'waiting' ? 'chờ' : c.usd ? money(c.usd) : c.state === 'skipped' ? 'bỏ qua' : '';
  const kind = c.kind === 'pause' || c.kind === 'attached' ? 'pause' : c.kind === 'gate' ? 'gate' : '';
  const changed = lastStates[c.id] && lastStates[c.id] !== c.state ? 'pop' : '';
  return `<div class="node ${c.state} ${kind} ${changed}" id="n-${esc(c.id)}">
    ${c.rounds > 1 ? `<span class="badge-round">×${c.rounds}</span>` : ''}
    <div class="dot"><i class="ph-bold ${icon}"></i></div>
    <div class="name">${esc(c.id)}</div><div class="note">${note}</div></div>`;
}

function curve(a, b, below) {
  if (!below) return `M${a.x},${a.y} L${b.x},${b.y}`;
  const midY = Math.max(a.y, b.y) + 40;
  return `M${a.x},${a.y} C${a.x},${midY} ${b.x},${midY} ${b.x},${b.y}`;
}

function drawWires(run) {
  const host = $('#flowInner');
  if (!host) return;
  const box = host.getBoundingClientRect();
  const pt = (id, edge) => {
    const el = document.getElementById(`n-${id}`)?.querySelector('.dot');
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const x = r.left - box.left + r.width / 2;
    const y = r.top - box.top + r.height / 2;
    return { right: { x: x + r.width / 2, y }, left: { x: x - r.width / 2, y }, bottom: { x, y: y + r.height / 2 }, top: { x, y: y - r.height / 2 } }[edge];
  };
  const { lane } = mainLane(run.cells);
  const paths = [];
  let live = null;
  lane.forEach((c, i) => {
    const next = lane[i + 1];
    if (!next) return;
    const a = pt(c.id, 'right'), b = pt(next.id, 'left');
    if (!a || !b) return;
    const isLive = c.state === 'done' && ['running', 'waiting'].includes(next.state);
    const cls = isLive ? `live${next.state === 'waiting' ? ' wait' : ''}` : c.state === 'done' && next.state !== 'pending' ? 'done' : '';
    const d = curve(a, b);
    if (isLive) live = { d, wait: next.state === 'waiting' };
    paths.push(`<path class="wire ${cls}" d="${d}"/>`);
  });
  for (const c of run.cells.filter((x) => x.back)) {
    const target = run.cells.find((x) => x.id === c.back);
    const from = pt(c.id, target?.side ? 'bottom' : 'bottom');
    const to = pt(c.back, target?.side ? 'top' : 'bottom');
    if (!from || !to) continue;
    const used = c.rounds > 1 || (target?.side && target.rounds > 0 && c.rounds > 0);
    const d = target?.side ? `M${from.x},${from.y} C${from.x},${(from.y + to.y) / 2} ${to.x},${(from.y + to.y) / 2} ${to.x},${to.y}` : curve(from, to, true);
    paths.push(`<path class="wire loop ${used ? 'used' : ''}" d="${d}"/>`);
    if (run.stage === c.back && target?.side) live = { d: `M${from.x},${from.y} C${from.x},${(from.y + to.y) / 2} ${to.x},${(from.y + to.y) / 2} ${to.x},${to.y}`, wait: false };
  }
  const packet = live && run.status !== 'stopped'
    ? `<circle r="4" class="packet ${live.wait ? 'wait' : ''}"><animateMotion dur="${live.wait ? '2.6s' : '1.1s'}" repeatCount="indefinite" path="${live.d}"/></circle>`
    : '';
  $('#wires').innerHTML = paths.join('') + packet;
  $('#wires').setAttribute('width', host.scrollWidth);
  $('#wires').setAttribute('height', host.scrollHeight);
}

function meter(label, used, limit, fmt) {
  const ratio = limit ? Math.min(used / limit, 1) : 0;
  const c = 2 * Math.PI * 20;
  const cls = ratio >= 1 ? 'over' : ratio > 0.75 ? 'hot' : '';
  return `<div class="meter"><svg width="52" height="52" viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="20"/><circle class="val ${cls}" cx="26" cy="26" r="20" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - ratio)}"/></svg>
    <div><b>${fmt(used)}</b><small>${label} / ${fmt(limit)}</small></div></div>`;
}

const BLOCK_TAG = 'h1|h2|h3|ul|ol|table|blockquote';
const tableHtml = (rows) => {
  const cells = rows.trim().split('\n').filter((r) => !/^\|[\s:|-]+\|\s*$/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, '').split('|'));
  const [head, ...body] = cells;
  return `<table><thead><tr>${head.map((c) => `<th>${c.trim()}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${c.trim()}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
};

function markdown(src) {
  const blocks = esc(src).split(/\n```[^\n]*\n([\s\S]*?)\n```/);
  return blocks.map((part, i) => {
    if (i % 2) return `<pre><code>${part}</code></pre>`;
    return part
      .replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/^# (.*)$/gm, '<h1>$1</h1>')
      .replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>')
      .replace(/(?:^\|.*\|[ \t]*(?:\n|$))+/gm, tableHtml)
      .replace(/(?:^\s*[-*] .*(?:\n|$))+/gm, (list) => `<ul>${list.trim().split('\n').map((l) => `<li>${l.replace(/^\s*[-*] /, '')}</li>`).join('')}</ul>`)
      .replace(/(?:^\d+\. .*(?:\n|$))+/gm, (list) => `<ol>${list.trim().split('\n').map((l) => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('')}</ol>`)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(new RegExp(`\\s*(</?(?:${BLOCK_TAG})>)\\s*`, 'g'), '$1')
      .replace(/\n{2,}/g, '<br><br>');
  }).join('');
}

function verdictView(v) {
  if (v.results) {
    return `<div class="verdict"><span class="tag ${v.pass ? 'pass' : 'fail'}"><i class="ph-bold ${v.pass ? 'ph-check-circle' : 'ph-warning'}"></i>${v.pass ? 'Cổng đạt' : 'Cổng chưa đạt'}</span>
      ${v.results.map((r, i) => `<div class="finding ${r.status === 'fail' || r.status === 'error' ? '' : 'adv'}" style="animation-delay:${i * 40}ms"><b>${esc(r.check)}</b> · ${esc(r.status)}${r.note ? ` · ${esc(r.note)}` : ''}${r.blocking?.length ? `<pre class="raw">${esc(r.blocking.join('\n'))}</pre>` : ''}</div>`).join('')}</div>`;
  }
  const list = (items, cls) => items.map((b, i) => `<div class="finding ${cls}" style="animation-delay:${i * 40}ms">${esc(typeof b === 'string' ? b : JSON.stringify(b))}</div>`).join('');
  return `<div class="verdict">
    <span class="tag ${esc(v.verdict)}"><i class="ph-bold ${v.verdict === 'pass' ? 'ph-check-circle' : 'ph-arrow-u-up-left'}"></i>${v.verdict === 'pass' ? 'Đạt' : v.verdict === 'revise' ? 'Cần sửa' : esc(v.verdict)}</span>
    ${v.note ? `<div class="md">${markdown(v.note)}</div>` : ''}
    ${v.blocking?.length ? `<h4>Chặn (${v.blocking.length})</h4>${list(v.blocking, '')}` : ''}
    ${v.advisory?.length ? `<h4>Gợi ý (${v.advisory.length})</h4>${list(v.advisory, 'adv')}` : ''}
    ${v.files?.length ? `<h4>File</h4><pre class="raw">${esc(v.files.join('\n'))}</pre>` : ''}</div>`;
}

async function renderArtifact(run) {
  const pane = $('#doc');
  if (!artifact) return (pane.innerHTML = '<p style="color:var(--text-3)">Chưa có kết quả nào.</p>');
  const text = await (await fetch(`/api/autopilot/runs/${run.key}/${run.runId}/artifacts/${encodeURIComponent(artifact)}`)).text();
  let html;
  if (artifact.endsWith('.md')) html = `<div class="md">${markdown(text)}</div>`;
  else if (artifact.endsWith('.json')) {
    try { html = verdictView(JSON.parse(text)); } catch { html = `<pre class="raw">${esc(text)}</pre>`; }
  } else html = `<pre class="raw">${esc(text.slice(-20000))}</pre>`;
  pane.innerHTML = `<div class="doc">${html}</div>`;
}

async function renderMain() {
  const run = data.runs.find((r) => r.key === selectedKey);
  if (!run) {
    $('#main').innerHTML = `<div class="empty"><div><i class="ph ph-flow-arrow"></i><p>Chọn một run bên trái, hoặc bấm <b>Chạy ticket</b> (⌘K) để autopilot tự chọn luồng và chạy tới mốc cần bạn.</p></div></div>`;
    $('#dock').classList.remove('show');
    return;
  }
  const files = await (await fetch(`/api/autopilot/runs/${run.key}/${run.runId}/artifacts`)).json();
  runFiles = files;
  const starred = files.filter((f) => run.show.some((g) => globRe(g).test(f)));
  const tabs = [...starred, ...files.filter((f) => !starred.includes(f) && !f.endsWith('.log')), ...files.filter((f) => f.endsWith('.log'))];
  if (!artifact || !files.includes(artifact)) artifact = starred.find((f) => f === 'plan.md') ?? starred.at(-1) ?? tabs[0] ?? null;

  const { lane, side } = mainLane(run.cells);
  const elapsed = run.receipts.reduce((n, r) => n + (r.ms ?? 0), 0);
  $('#main').innerHTML = `
    <div class="top">
      <div>
        <div class="head"><h1>${esc(run.key)}</h1><span class="state ${run.status}">${STATUS[run.status]}${run.stopReason ? ` · ${esc(run.stopReason)}` : ''}</span></div>
        <div class="meta">${esc(run.flowLabel)}. Router chọn vì: ${esc(run.routerReason)}</div>
        <div class="meta"><code>${esc(run.campaignDir ?? 'chưa có campaign')}</code></div>
      </div>
      <div class="meters">${meter('ngân sách', run.totals.usd, run.budget.usd, money)}${meter('phút máy', mins(elapsed), run.budget.minutes, (n) => `${n}′`)}</div>
    </div>
    <div class="flow"><div class="flow-inner" id="flowInner">
      <svg class="wires" id="wires"></svg>
      <div class="lane">${lane.map(nodeHtml).join('')}</div>
      ${side.length ? `<div class="lane side" id="sideLane">${side.map(nodeHtml).join('')}</div>` : ''}
    </div></div>
    <div class="panes">
      <section>
        <div class="tabs">${tabs.map((f) => `<button class="tab ${f === artifact ? 'on' : ''}" data-file="${esc(f)}">${starred.includes(f) ? '<span class="star">★</span>' : ''}${esc(TAB_LABEL(f))}</button>`).join('')}</div>
        <div id="doc"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
      </section>
      <section>
        <p class="side-h">Các lượt đã chạy</p>
        <div class="timeline">${run.receipts.map((r, i) => `
          <div class="tl ${esc(r.verdict)}" style="animation-delay:${i * 30}ms">
            <div class="row1"><b>${esc(r.stage)} · vòng ${r.round}</b><span>${money(r.costUsd)}</span></div>
            <div class="row2">${esc(r.verdict)} · ${r.blocking} chặn · ${r.advisory} gợi ý · ${r.turns} lượt · ${mins(r.ms)}′</div>
          </div>`).join('') || '<p style="color:var(--text-3);font-size:13px">Chưa có lượt nào.</p>'}</div>
        <div class="total"><span>${run.totals.runs} lượt claude · ${run.totals.turns} turns</span><span>${money(run.totals.usd)}</span></div>
      </section>
    </div>`;
  placeSideLane(run, lane, side);
  requestAnimationFrame(() => drawWires(run));
  renderDock(run);
  renderArtifact(run);
  lastStates = Object.fromEntries(run.cells.map((c) => [c.id, c.state]));
}

function placeSideLane(run, lane) {
  const sideLane = $('#sideLane');
  if (!sideLane) return;
  const callerIdx = Math.min(...run.cells.filter((c) => c.back && !lane.some((l) => l.id === c.back)).map((c) => lane.findIndex((l) => l.id === c.id)).filter((i) => i >= 0));
  if (Number.isFinite(callerIdx)) sideLane.style.paddingLeft = `${callerIdx * (92 + 44)}px`;
}

function renderDock(run) {
  const show = run.status === 'paused' || run.status === 'attached' || run.status === 'stopped';
  $('#dock').classList.toggle('show', show);
  if (!show) return;
  const paused = run.status === 'paused';
  $('#dockStage').textContent = run.status === 'stopped' ? `run đã dừng (${run.stopReason})` : run.status === 'attached' ? `${run.stage}: chạy ${run.command} trong phiên Claude` : run.stage;
  $('#note').style.display = paused ? '' : 'none';
  $('#prevNote').textContent = run.rejectNote ? `Lần trả về trước: ${run.rejectNote}` : '';
  $('#actions').innerHTML = paused
    ? `<button class="btn ghost" data-act="abort">Huỷ run</button><button class="btn back" data-act="reject"><i class="ph-bold ph-arrow-u-up-left"></i>Trả về <kbd>R</kbd></button><button class="btn go" data-act="approve"><i class="ph-bold ph-check"></i>Duyệt <kbd>A</kbd></button>`
    : run.status === 'attached'
      ? `<button class="btn ghost" data-act="abort">Huỷ run</button><button class="btn go" data-act="approve"><i class="ph-bold ph-check"></i>Đã xong, chạy tiếp</button>`
      : run.stopReason === 'aborted' ? '' : `<button class="btn go" data-act="resume"><i class="ph-bold ph-play"></i>Chạy tiếp</button>`;
}

async function refresh() {
  const next = await (await fetch('/api/autopilot/runs')).json();
  const sig = JSON.stringify(next.runs);
  data = next;
  selectedKey ??= data.runs[0]?.key ?? null;
  if (sig === lastSig) return;
  lastSig = sig;
  renderQueue();
  if (document.activeElement?.id !== 'note') await renderMain();
}

async function act(action) {
  const run = data.runs.find((r) => r.key === selectedKey);
  if (!run) return;
  const note = $('#note').value.trim();
  if (action === 'reject' && !note) {
    $('#note').focus();
    return toast('Trả về cần ghi chú để bước sau biết sửa gì.', true);
  }
  document.querySelectorAll('#actions .btn').forEach((b) => (b.disabled = true));
  if (!(await post(action, { key: run.key, note }))) return renderDock(run);
  $('#note').value = '';
  $('#actions').innerHTML = `<span class="sending"><i class="ph-bold ph-circle-notch spin"></i>Đã gửi lệnh ${ACTION_LABEL[action]}, chờ autopilot nhận…</span>`;
  lastSig = '';
  setTimeout(refresh, 1500);
}

function renderFlows() {
  const opts = [{ id: '', label: 'Router tự chọn luồng' }, ...data.flows];
  $('#flows').innerHTML = opts.map((f, i) => `<button class="flowopt ${i === flowChoice ? 'on' : ''}" data-i="${i}"><span>${esc(f.label)}</span><small>${esc(f.id || 'auto')}</small></button>`).join('');
}
function openPalette() {
  flowChoice = 0;
  renderFlows();
  $('#veil').classList.add('show');
  setTimeout(() => $('#ticket').focus(), 50);
}
const closePalette = () => $('#veil').classList.remove('show');
async function startRun() {
  const input = $('#ticket').value.trim();
  if (!input) return toast('Nhập mã ticket hoặc link.', true);
  const flow = [{ id: '' }, ...data.flows][flowChoice].id || undefined;
  if (await post('run', { input, flow })) {
    $('#ticket').value = '';
    closePalette();
    selectedKey = input.match(/[A-Z][A-Z0-9]*-\d+/)?.[0] ?? selectedKey;
    setTimeout(() => { lastSig = ''; refresh(); }, 2500);
  }
}

$('#queue').addEventListener('click', (e) => {
  const key = e.target.closest('.item')?.dataset.key;
  if (!key || key === selectedKey) return;
  selectedKey = key;
  artifact = null;
  lastStates = {};
  renderQueue();
  renderMain();
});
function stageFile(id) {
  const rounds = runFiles.filter((f) => f.startsWith(`${id}-r`) && f.endsWith('.json')).sort();
  return id === 'plan' && runFiles.includes('plan.md') ? 'plan.md' : rounds.at(-1);
}
$('#main').addEventListener('click', (e) => {
  const node = e.target.closest('.node');
  if (node) {
    const file = stageFile(node.id.slice(2));
    if (!file) return toast(`Bước ${node.id.slice(2)} chưa chạy, chưa có kết quả để xem.`);
    artifact = file;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.file === file));
    renderArtifact(data.runs.find((r) => r.key === selectedKey));
    return $('.panes').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  const tab = e.target.closest('.tab');
  if (!tab) return;
  artifact = tab.dataset.file;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === tab));
  renderArtifact(data.runs.find((r) => r.key === selectedKey));
});
$('#actions').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (b) act(b.dataset.act);
});
$('#openPalette').addEventListener('click', openPalette);
$('#veil').addEventListener('click', (e) => {
  if (e.target.id === 'veil') return closePalette();
  const opt = e.target.closest('.flowopt');
  if (opt) { flowChoice = Number(opt.dataset.i); renderFlows(); $('#ticket').focus(); }
});
document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
  if ($('#veil').classList.contains('show')) {
    const total = data.flows.length + 1;
    if (e.key === 'Escape') closePalette();
    if (e.key === 'ArrowDown') { flowChoice = (flowChoice + 1) % total; renderFlows(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { flowChoice = (flowChoice + total - 1) % total; renderFlows(); e.preventDefault(); }
    if (e.key === 'Enter') startRun();
    return;
  }
  if (typing || !$('#dock').classList.contains('show')) return;
  if (e.key === 'a') act('approve');
  if (e.key === 'r') $('#note').focus();
});
$('#note').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) act('reject');
});
window.addEventListener('resize', () => {
  const run = data.runs.find((r) => r.key === selectedKey);
  if (run) drawWires(run);
});

refresh();
setInterval(() => refresh().catch(() => {}), 4000);
</script>
</body>
